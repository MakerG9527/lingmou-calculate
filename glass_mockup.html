<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1100px; min-height: 720px;
  background: linear-gradient(135deg, #eaf4ff 0%, #f0fbff 38%, #eafcf5 100%);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  padding: 30px 40px 40px;
}
#hero { text-align: center; padding: 14px 20px 22px; }
#hero h1 {
  font-size: 34px; font-weight: 700; letter-spacing: .5px; margin-bottom: 8px;
  background: linear-gradient(90deg, #2b7de9, #18b6a6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#hero p { color: #5b6b85; font-size: 15px; }
#hero .pill {
  display: inline-block; margin-top: 14px; padding: 6px 18px;
  font-size: 13px; color: #1f7a6e; font-weight: 600;
  background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8);
  border-radius: 999px; backdrop-filter: blur(12px);
  box-shadow: 0 2px 10px rgba(80,140,200,.12);
}
.row { display: flex; gap: 26px; margin-top: 10px; }
.glass-card {
  flex: 1;
  background: rgba(255,255,255,.45);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 22px;
  backdrop-filter: blur(22px) saturate(160%);
  box-shadow: 0 8px 32px rgba(90,140,200,.14), inset 0 1px 0 rgba(255,255,255,.6);
  padding: 22px;
}
.lbl { color: #3a4a66; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.imgbox {
  height: 230px; border-radius: 16px;
  background: rgba(255,255,255,.4); border: 1px dashed rgba(150,185,225,.7);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #8aa0bd; font-size: 14px; gap: 8px;
}
.imgbox .ic { font-size: 34px; }
.check { margin: 14px 2px; color: #4a5a78; font-size: 13.5px; display:flex; align-items:center; gap:8px;}
.check .box { width:18px;height:18px;border-radius:6px;border:1px solid rgba(150,185,225,.8);background:rgba(255,255,255,.6);}
.btn {
  width: 100%; margin-top: 8px; padding: 13px; border: 1px solid rgba(255,255,255,.5);
  border-radius: 14px; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer;
  background: linear-gradient(135deg, rgba(90,169,230,.95), rgba(24,182,166,.95));
  box-shadow: 0 6px 18px rgba(60,150,200,.28), inset 0 1px 0 rgba(255,255,255,.4);
}
.field {
  width: 100%; padding: 12px 14px; border-radius: 14px;
  border: 1px solid rgba(180,205,235,.6); background: rgba(255,255,255,.6);
  color: #243047; font-size: 14px; margin-bottom: 4px; min-height: 76px;
  box-shadow: inset 0 1px 3px rgba(120,160,210,.08);
}
.field.mono { font-family: "SF Mono", Consolas, monospace; }
.result {
  width: 100%; padding: 14px; border-radius: 14px; min-height: 76px;
  background: rgba(234,252,245,.7); border: 1px solid rgba(120,200,180,.5);
  color: #135f54; font-size: 18px; font-weight: 600;
  font-family: "SF Mono", Consolas, monospace;
}
.foot { text-align:center; color:#7a8aa5; font-size:13px; padding:22px 20px 0; line-height:1.8; }
.foot b { color:#3a4a66; }
.spacer { height: 14px; }
</style>
</head>
<body>
  <div id="hero">
    <h1>灵眸智算</h1>
    <p>专业离线符号计算器 · 原型演示</p>
    <span class="pill">全程本地 CPU 运行 · 模型下载后可断网</span>
  </div>
  <div class="row">
    <div class="glass-card">
      <div class="lbl">① 公式图片（可上传或摄像头拍，印刷体识别率最高）</div>
      <div class="imgbox">
        <div class="ic">⊕</div>
        <div>点击上传，或拖入公式图片</div>
      </div>
      <div class="check"><span class="box"></span>水平翻转（摄像头是镜像、拍出来字反了就勾上）</div>
      <button class="btn">② 识别公式</button>
    </div>
    <div class="glass-card">
      <div class="lbl">③ 识别结果（LaTeX，可手动修正后再计算）</div>
      <div class="field mono">\int_{0}^{1} x^2 \, dx</div>
      <div class="spacer"></div>
      <button class="btn">④ 计算</button>
      <div class="spacer"></div>
      <div class="lbl">⑤ 计算结果（精确符号解）</div>
      <div class="result">结果：1/3　（数值：0.33333…）</div>
    </div>
  </div>
  <div class="foot">
    识别端：开源小模型 Pix2Text ｜ 计算端：SymPy 符号引擎 ｜ 二者均<b>本地离线</b>运行。<br>
    识别有小误差时，可在 ③ 直接修改——这正对应产品<b>「主动核对 / 可修正」</b>的设计理念。
  </div>
</body>
</html>
